appId: com.leapsofts.erpdesktop
productName: Leapsofts ERP
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
  - node_modules/uiohook-napi/**
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon-tray.png
    to: icon-tray.png
  - from: build/icon-tray@2x.png
    to: icon-tray@2x.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.business
  icon: build/icon.icns
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  icon: build/icon.png
  maintainer: aliroohan321@gmail.com
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
