appId: com.leapsofts.erpdesktop
productName: Leapsofts ERP
directories:
  output: dist
  buildResources: build
# uiohook-napi must compile on the host OS and CPU. Default packaging is
# host-arch only (see scripts/run-electron-builder.mjs). Do not use -mwl.
# Intel DMG: Leapsofts ERP-<ver>-mac-x64.dmg  |  Apple Silicon: ...-mac-arm64.dmg
beforeBuild: scripts/before-build.cjs
nodeGypRebuild: false
buildDependenciesFromSource: false
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
  - node_modules/uiohook-napi/**
  - node_modules/@miniben90/**
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon-tray.png
    to: icon-tray.png
  - from: build/icon-tray@2x.png
    to: icon-tray@2x.png
mac:
  # Arch comes from CLI (--x64 / --arm64). Do not list both here: that ships a
  # default x64 DMG without a suffix plus a separate -arm64 DMG, and the wrong
  # one fails with "this application is not supported on this Mac".
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.business
  icon: build/icon.icns
  extendInfo:
    NSAppleEventsUsageDescription: >-
      Leapsofts ERP reads the active browser tab address to record work
      activity during your shift.
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  icon: build/icon.png
  maintainer: aliroohan321@gmail.com
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
